<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shieldClip">
      <path d="M256 64 L396 116 V248 C396 338 336 404 256 436 C176 404 116 338 116 248 V116 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Shield Border -->
  <path d="M256 64 L396 116 V248 C396 338 336 404 256 436 C176 404 116 338 116 248 V116 Z"
        fill="#111827" stroke="url(#accent)" stroke-width="18" stroke-linejoin="round"/>

  <!-- Inner Clipped Content: Crossed Swords & Balance Beam -->
  <g clip-path="url(#shieldClip)">
    <!-- Sword 1 (top-left to bottom-right) -->
    <line x1="160" y1="140" x2="352" y2="332" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"/>
    <line x1="140" y1="180" x2="180" y2="140" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>

    <!-- Sword 2 (top-right to bottom-left) -->
    <line x1="352" y1="140" x2="160" y2="332" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"/>
    <line x1="372" y1="180" x2="332" y2="140" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>

    <!-- Center Balance Scales -->
    <circle cx="256" cy="220" r="14" fill="url(#gold)"/>
    <line x1="256" y1="220" x2="256" y2="360" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <line x1="190" y1="240" x2="322" y2="240" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>

    <!-- Scale Pans -->
    <path d="M170 280 Q190 300 210 280 Z" fill="url(#gold)"/>
    <line x1="190" y1="240" x2="190" y2="280" stroke="url(#gold)" stroke-width="6"/>

    <path d="M302 280 Q322 300 342 280 Z" fill="url(#gold)"/>
    <line x1="322" y1="240" x2="322" y2="280" stroke="url(#gold)" stroke-width="6"/>
  </g>

  <!-- Outer Shield Accent Ring -->
  <path d="M256 94 L370 136 V244 C370 318 320 374 256 402 C192 374 142 318 142 244 V136 Z"
        fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.6"/>
</svg>
